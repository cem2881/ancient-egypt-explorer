
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kayıp Firavun v26</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#c9a16d;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#26190dcc;color:white;padding:11px 14px;border-radius:12px;font-size:12px;pointer-events:none}
#title{font-size:17px;font-weight:bold;margin-bottom:5px}
#joy{position:fixed;z-index:10;left:22px;bottom:25px;width:116px;height:116px;border:2px solid #ffffff88;background:#ffffff30;border-radius:50%;touch-action:none}
#stick{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#ffffffbb;border:2px solid white}
#lookArea{position:fixed;z-index:2;left:150px;right:0;top:0;bottom:0;touch-action:none}
#hint{position:fixed;z-index:5;right:12px;bottom:14px;color:white;background:#26190dbb;padding:8px 10px;border-radius:9px;font-size:11px;pointer-events:none}
#error{display:none;position:fixed;z-index:30;inset:10px;background:#300;color:white;padding:20px;white-space:pre-wrap;overflow:auto}
</style>
</head>
<body>
<div id="hud">
 <div id="title">KAYIP FİRAVUN</div>
 <div>ANTİK MISIR • GÖRSEL YENİLEME</div>
 <div id="status">Çölü keşfet</div>
</div>
<div id="lookArea"></div>
<div id="joy"><div id="stick"></div></div>
<div id="hint">Sol: Hareket · Sağ: Kamera</div>
<div id="error"></div>

<script>
function showError(m){
 const e=document.getElementById("error");
 e.style.display="block";
 e.textContent="Oyun hatası:\n"+m;
}
window.addEventListener("error",e=>showError(e.message));
window.addEventListener("unhandledrejection",e=>showError(String(e.reason)));
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe5bd87);
scene.fog=new THREE.Fog(0xe5bd87,48,125);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,8);

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe7c2,0x705036,2));
const sun=new THREE.DirectionalLight(0xffd59a,2);
sun.position.set(-30,40,20);
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
const sand=material(0xd0a66f);
const pale=material(0xe5c18e);
const stone=material(0xc2a078);
const darkStone=material(0x806044);
const green=material(0x466b39);
const water=material(0x397b91);
const oasisWater=material(0x438d91);
const leather=material(0x593923);
const leatherLight=material(0x805333);
const cloth=material(0xc5aa7d);
const darkLeather=material(0x30231b);
const bronze=material(0x9d7137);
const metal=material(0x9a9a8a);
const skin=material(0x956747);
const hood=material(0x49382c);
const gold=material(0xc69a42);
const houseMat=material(0xb99568);
const roofMat=material(0x79563b);
const awningMat=material(0x9b4930);
const marketMat=material(0x795035);

// Hafif prosedürel yüzey dokuları
function makeTexture(base,count,seed){
 const c=document.createElement("canvas");
 c.width=c.height=256;
 const ctx=c.getContext("2d");
 ctx.fillStyle=base;
 ctx.fillRect(0,0,256,256);
 let s=seed;
 function rand(){
  s=(s*1664525+1013904223)>>>0;
  return s/4294967296;
 }
 for(let i=0;i<count;i++){
  const x=rand()*256,y=rand()*256;
  const r=.5+rand()*2.8;
  const a=.025+rand()*.11;
  const v=rand()>.5?255:35;
  ctx.fillStyle=`rgba(${v},${v*.83},${v*.62},${a})`;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
 }
 const t=new THREE.CanvasTexture(c);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 t.colorSpace=THREE.SRGBColorSpace;
 t.anisotropy=2;
 return t;
}
const sandTex=makeTexture("#c9a16d",2600,12);
const stoneTex=makeTexture("#b99a72",1900,34);
const darkTex=makeTexture("#806447",1500,77);
sand.map=sandTex;
pale.map=stoneTex;
stone.map=stoneTex;
darkStone.map=darkTex;
houseMat.map=stoneTex;
for(const m of [sand,pale,stone,darkStone,houseMat])m.needsUpdate=true;

// Ortak model fonksiyonu
function mesh(g,m,x,y,z,sx=1,sy=1,sz=1,parent=scene){
 const o=new THREE.Mesh(g,m);
 o.position.set(x,y,z);
 o.scale.set(sx,sy,sz);
 parent.add(o);
 return o;
}

// Çöl
const ground=mesh(new THREE.PlaneGeometry(240,240),sand,0,-.16,0);
ground.rotation.x=-Math.PI/2;

for(let i=0;i<24;i++){
 const x=(Math.random()-.5)*170;
 const z=(Math.random()-.5)*170;
 mesh(new THREE.SphereGeometry(1,8,6),i%2?pale:stone,
 x,-.35,z,8+Math.random()*7,1,4+Math.random()*4);
}

// Piramitler
function pyramid(x,z,size){
 const p=mesh(new THREE.ConeGeometry(size,size*.88,4),stone,x,size*.44,z);
 p.rotation.y=Math.PI/4;
 mesh(new THREE.BoxGeometry(size*1.45,.25,size*1.45),darkStone,x,.08,z);
}
pyramid(-16,-28,17);
pyramid(-38,-45,10);
pyramid(25,-48,12);

// Tapınak
const temple=new THREE.Group();
scene.add(temple);
mesh(new THREE.BoxGeometry(17,1,12),darkStone,18,.5,-17,1,1,1,temple);
mesh(new THREE.BoxGeometry(15,5,10),stone,18,3,-17,1,1,1,temple);
mesh(new THREE.BoxGeometry(17,1,12),pale,18,5.7,-17,1,1,1,temple);
for(let x=12;x<=24;x+=3){
 mesh(new THREE.CylinderGeometry(.65,.8,4.5,8),pale,x,3,-11,1,1,1,temple);
 mesh(new THREE.CylinderGeometry(.9,.9,.3,8),bronze,x,5.2,-11,1,1,1,temple);
}

// Nil
const river=mesh(new THREE.PlaneGeometry(15,110),water,-50,.01,-10);
river.rotation.x=-Math.PI/2;
river.rotation.z=-.18;

// Palmiye
function palm(x,z){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 mesh(new THREE.CylinderGeometry(.2,.38,5,7),darkStone,0,2.5,0,1,1,1,g);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const leaf=mesh(new THREE.ConeGeometry(.48,4,5),green,
  Math.cos(a)*1.3,5,Math.sin(a)*1.3,1,1,1,g);
  leaf.rotation.z=-Math.cos(a)*.8;
  leaf.rotation.x=Math.sin(a)*.8;
 }
 mesh(new THREE.SphereGeometry(.4,7,6),green,0,5,0,1,1,1,g);
}
[[-40,8],[-44,16],[-36,22],[-55,-25],[-5,12],[35,8],[39,13],[31,15],[5,-35]].forEach(p=>palm(p[0],p[1]));

// Kayalar
for(let i=0;i<35;i++){
 const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;
 if(Math.abs(x)<5&&Math.abs(z)<8)continue;
 const r=mesh(new THREE.DodecahedronGeometry(1,0),i%2?darkStone:stone,
 x,.4,z,.5+Math.random(),.4+Math.random()*.5,.5+Math.random());
 r.rotation.set(Math.random(),Math.random(),Math.random());
}

// Yollar
const roadMat=material(0xc49a69);
function road(x,z,w,h,rot=0){
 const r=mesh(new THREE.PlaneGeometry(w,h),roadMat,x,.015,z);
 r.rotation.x=-Math.PI/2;
 r.rotation.z=rot;
}
road(37,-5,17,65);
road(29,-10,48,10);
road(43,15,40,8,.15);
road(54,34,8,38,-.4);

// Köy evleri
function house(x,z,size=1){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 mesh(new THREE.BoxGeometry(5*size,3*size,4*size),houseMat,0,1.5*size,0,1,1,1,g);
 mesh(new THREE.BoxGeometry(5.4*size,.35*size,4.4*size),roofMat,0,3.1*size,0,1,1,1,g);
 mesh(new THREE.BoxGeometry(.9*size,1.8*size,.12*size),darkLeather,0,.9*size,-2.05*size,1,1,1,g);
 mesh(new THREE.BoxGeometry(.65*size,.65*size,.13*size),darkStone,1.45*size,2*size,-2.06*size,1,1,1,g);
 mesh(new THREE.BoxGeometry(1.4*size,.2*size,.7*size),pale,0,.1*size,-2.35*size,1,1,1,g);
}
house(27,-8);
house(43,-10,.9);
house(28,8,.85);
house(48,7);
house(37,23,.95);
house(55,-1,.8);

// Pazar
function stall(x,z){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 mesh(new THREE.BoxGeometry(3,1.1,1.8),marketMat,0,.7,0,1,1,1,g);
 mesh(new THREE.BoxGeometry(3.5,.18,2.2),awningMat,0,1.45,0,1,1,1,g);
 for(const sx of [-1.45,1.45]){
  for(const sz of [-.85,.85]){
   mesh(new THREE.CylinderGeometry(.055,.055,2,5),darkLeather,sx,1,sz,1,1,1,g);
  }
 }
 for(let i=0;i<3;i++){
  mesh(new THREE.SphereGeometry(.22,7,5),i===1?gold:green,-.8+i*.8,1.35,-.3,1,1,1,g);
 }
}
stall(32,-18);
stall(41,-19);
stall(36,-23);

// Ambar
mesh(new THREE.BoxGeometry(8,4,7),roofMat,57,2,17);
mesh(new THREE.ConeGeometry(6,2.5,4),darkStone,57,5.1,17,1,1,1);

// Vaha
function oasis(x,z){
 const pond=mesh(new THREE.CircleGeometry(8,24),oasisWater,x,.025,z);
 pond.rotation.x=-Math.PI/2;
 const shore=mesh(new THREE.TorusGeometry(8.5,.8,5,24),pale,x,.04,z);
 shore.rotation.x=Math.PI/2;
 for(let i=0;i<9;i++){
  const a=i*Math.PI*2/9;
  const px=x+Math.cos(a)*11,pz=z+Math.sin(a)*11;
  mesh(new THREE.CylinderGeometry(.18,.3,4.5,6),darkStone,px,2.25,pz);
  for(let j=0;j<5;j++){
   const b=j*Math.PI*2/5;
   const leaf=mesh(new THREE.ConeGeometry(.45,3.5,5),green,
   px+Math.cos(b)*1.2,4.4,pz+Math.sin(b)*1.2);
   leaf.rotation.z=-Math.cos(b)*.8;
   leaf.rotation.x=Math.sin(b)*.8;
  }
 }
}
oasis(65,48);

// Harabeler
function ruins(x,z){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 mesh(new THREE.BoxGeometry(12,.5,9),darkStone,0,.25,0,1,1,1,g);
 for(let i=0;i<4;i++){
  mesh(new THREE.CylinderGeometry(.55,.7,4.5,7),stone,
  (i%2)*8-4,2.5,Math.floor(i/2)*5-2.5,1,1,1,g);
 }
 mesh(new THREE.BoxGeometry(11,.7,1.2),pale,0,4.8,-2.5,1,1,1,g);
 mesh(new THREE.BoxGeometry(11,.7,1.2),pale,0,4.8,2.5,1,1,1,g);
}
ruins(-35,35);
ruins(75,-40);

// Uzak yapılar
function landmark(x,z){
 mesh(new THREE.CylinderGeometry(2.5,3.2,5,6),darkStone,x,2.5,z);
 mesh(new THREE.ConeGeometry(3,2,6),stone,x,6,z);
}
landmark(-65,-65);
landmark(70,65);
landmark(5,-75);

// Köy girişi
const gate=new THREE.Group();
scene.add(gate);
gate.position.set(37,0,-32);
mesh(new THREE.BoxGeometry(1.2,5,1.2),stone,-3,2.5,0,1,1,1,gate);
mesh(new THREE.BoxGeometry(1.2,5,1.2),stone,3,2.5,0,1,1,1,gate);
mesh(new THREE.BoxGeometry(8,1.2,1.5),darkStone,0,5,0,1,1,1,gate);

// Medjay karakteri
const player=new THREE.Group();
scene.add(player);
const body=new THREE.Group();
player.add(body);
function part(g,m,x,y,z,sx=1,sy=1,sz=1,parent=body){
 return mesh(g,m,x,y,z,sx,sy,sz,parent);
}
const legs=[];
for(const side of [-1,1]){
 legs.push(part(new THREE.CylinderGeometry(.16,.19,.9,7),leatherLight,side*.2,.55,0));
 part(new THREE.BoxGeometry(.34,.2,.48),darkLeather,side*.2,.12,-.08);
 part(new THREE.BoxGeometry(.32,.25,.22),leather,side*.2,.68,-.12);
}
part(new THREE.CylinderGeometry(.39,.52,1.2,8),cloth,0,1.55,0);
part(new THREE.BoxGeometry(.78,.85,.18),leather,0,1.75,-.27);
const strap1=part(new THREE.BoxGeometry(.13,1.05,.12),leatherLight,-.12,1.78,-.39);
strap1.rotation.z=-.42;
const strap2=part(new THREE.BoxGeometry(.11,.9,.12),darkLeather,.2,1.8,-.4);
strap2.rotation.z=.5;
part(new THREE.SphereGeometry(.25,8,6),leatherLight,-.48,2.02,0,1,.75,1);
part(new THREE.SphereGeometry(.25,8,6),leatherLight,.48,2.02,0,1,.75,1);
part(new THREE.BoxGeometry(.85,.16,.55),darkLeather,0,1.12,0);
part(new THREE.BoxGeometry(.2,.19,.08),bronze,0,1.12,-.3);
for(let i=-1;i<=1;i++)part(new THREE.BoxGeometry(.25,.65,.08),i===0?cloth:leatherLight,i*.24,.72,-.24);
part(new THREE.CylinderGeometry(.14,.15,.25,8),skin,0,2.28,0);
part(new THREE.SphereGeometry(.31,10,8),skin,0,2.57,0);
part(new THREE.SphereGeometry(.39,10,8),hood,0,2.75,.04,1,1.05,1.05);
part(new THREE.BoxGeometry(.18,.65,.3),hood,-.3,2.55,.02);
part(new THREE.BoxGeometry(.18,.65,.3),hood,.3,2.55,.02);
part(new THREE.BoxGeometry(.66,.13,.23),leatherLight,0,2.79,-.25);
const arms=[];
for(const side of [-1,1]){
 const arm=part(new THREE.CylinderGeometry(.13,.17,.82,7),skin,side*.52,1.65,0);
 arm.rotation.z=side*.17;
 arms.push(arm);
 part(new THREE.BoxGeometry(.25,.36,.28),leatherLight,side*.58,1.48,-.04);
 part(new THREE.CylinderGeometry(.17,.17,.16,8),bronze,side*.58,1.27,0);
}
const bowGroup=new THREE.Group();
body.add(bowGroup);
bowGroup.position.set(.42,1.75,.28);
const bow=part(new THREE.TorusGeometry(.48,.035,5,12,Math.PI),leatherLight,0,0,0,1,1,1,bowGroup);
bow.rotation.z=Math.PI/2;
part(new THREE.CylinderGeometry(.13,.17,.8,7),darkLeather,.2,1.9,.38);
for(let i=0;i<4;i++)part(new THREE.CylinderGeometry(.018,.018,.95,4),cloth,.08+i*.075,2.45,.38);
const sword=new THREE.Group();
body.add(sword);
sword.position.set(.55,1.1,-.05);
sword.rotation.z=-.35;
part(new THREE.BoxGeometry(.09,.65,.07),metal,0,-.35,0,1,1,1,sword);
part(new THREE.BoxGeometry(.3,.09,.1),bronze,0,-.05,0,1,1,1,sword);
part(new THREE.CylinderGeometry(.045,.045,.25,6),darkLeather,0,.12,0,1,1,1,sword);
part(new THREE.BoxGeometry(.38,.55,.12),cloth,-.43,1.65,.12);

// Kontroller
let angle=0,joyX=0,joyY=0,looking=false,lastX=0,steps=0;
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
const lookArea=document.getElementById("lookArea");

function updateJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=38,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max;}
 joyX=x/max;joyY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function resetJoy(){
 joyX=0;joyY=0;
 stick.style.transform="translate(0,0)";
}
joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);updateJoy(e);
});
joy.addEventListener("pointermove",e=>{
 if(joy.hasPointerCapture(e.pointerId))updateJoy(e);
});
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

lookArea.addEventListener("pointerdown",e=>{
 looking=true;lastX=e.clientX;
 lookArea.setPointerCapture(e.pointerId);
});
lookArea.addEventListener("pointermove",e=>{
 if(!looking)return;
 angle-=(e.clientX-lastX)*.006;
 lastX=e.clientX;
});
lookArea.addEventListener("pointerup",()=>looking=false);
lookArea.addEventListener("pointercancel",()=>looking=false);

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Oyun döngüsü
const clock=new THREE.Clock();
const target=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let x=joyX,y=joyY;
 if(keys.w||keys.arrowup)y=-1;
 if(keys.s||keys.arrowdown)y=1;
 if(keys.a||keys.arrowleft)x=-1;
 if(keys.d||keys.arrowright)x=1;
 const moving=Math.hypot(x,y)>.12;

 if(moving){
  const speed=5*dt;
  const mx=(x*Math.cos(angle)+y*Math.sin(angle))*speed;
  const mz=(x*Math.sin(angle)-y*Math.cos(angle))*speed;
  player.position.x+=mx;
  player.position.z+=mz;
  body.rotation.y=Math.atan2(mx,-mz);
  steps+=dt*10;
  legs[0].rotation.x=Math.sin(steps)*.5;
  legs[1].rotation.x=-Math.sin(steps)*.5;
  arms[0].rotation.x=-Math.sin(steps)*.3;
  arms[1].rotation.x=Math.sin(steps)*.3;
 }else{
  legs.forEach(l=>l.rotation.x*=.8);
  arms.forEach(a=>a.rotation.x*=.8);
 }

 target.set(
  player.position.x+Math.sin(angle)*7.5,
  player.position.y+4.2,
  player.position.z+Math.cos(angle)*7.5
 );
 camera.position.lerp(target,.1);
 camera.lookAt(player.position.x,player.position.y+1.5,player.position.z);
 document.getElementById("status").textContent=moving?"Keşfe devam et...":"Çölü keşfet";
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio,1));
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
