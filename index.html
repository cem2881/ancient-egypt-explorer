<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#19150f">
<title>MEDJAY 2.1 — Çöl Yenilemesi</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{--gold:#edcc83;--glass:rgba(16,19,20,.82);--edge:rgba(237,204,131,.48)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9f8056;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#8eb8c8 0%,#d7b77e 64%,#c59e67 100%)}
#game>canvas{position:absolute;inset:0;display:block;width:100%!important;height:100%!important;touch-action:none}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;text-shadow:0 2px 8px #000b}
.brand{position:absolute;left:max(17px,env(safe-area-inset-left));top:max(13px,env(safe-area-inset-top));color:#f1d28f;font-size:clamp(19px,3vw,29px);font-weight:950;letter-spacing:4px;line-height:1}
.brand small{display:block;margin-top:5px;color:#fff;font-size:8px;letter-spacing:4px;opacity:.84}
.panel{position:absolute;right:max(15px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:min(320px,48vw);padding:11px 14px;border:1px solid var(--edge);border-radius:13px;background:var(--glass);backdrop-filter:blur(12px);font-size:12px;line-height:1.4}
.panel b{display:block;margin-bottom:4px;color:var(--gold);font-size:9px;letter-spacing:2px}
#counter{position:absolute;left:max(17px,env(safe-area-inset-left));top:76px;padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--glass);font-size:11px;letter-spacing:.4px}
#counter strong{color:var(--gold);font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;top:25%;max-width:86vw;transform:translate(-50%,-9px);opacity:0;transition:.22s;background:var(--glass);border:1px solid var(--edge);padding:11px 16px;border-radius:12px;font-size:12px;text-align:center;white-space:normal}
#toast.show{opacity:1;transform:translate(-50%,0)}
#stick{position:absolute;left:max(19px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:clamp(88px,17vw,126px);height:clamp(88px,17vw,126px);border:1px solid #fff9;border-radius:50%;background:radial-gradient(circle,#ffffff20,#15110b70);box-shadow:0 6px 22px #0006,inset 0 0 18px #fff2;pointer-events:auto;touch-action:none}
#nub{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;border:2px solid #fff;background:linear-gradient(145deg,#fff,#bdb8ac);box-shadow:0 4px 12px #0008}
.actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:clamp(8px,1.8vw,13px);align-items:flex-end;pointer-events:auto}
button{width:clamp(52px,9.5vw,68px);height:clamp(52px,9.5vw,68px);border-radius:50%;border:1px solid var(--edge);background:linear-gradient(145deg,#6e542f,#211b13);color:#fff;font:850 10px system-ui;letter-spacing:.6px;box-shadow:0 5px 17px #0008;touch-action:none}
button.primary{width:clamp(62px,10.5vw,78px);height:clamp(62px,10.5vw,78px);background:linear-gradient(145deg,#b58d4c,#624725)}
button:active,button.active{filter:brightness(1.4);transform:scale(.96)}
#help{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:9px;color:#fffC;white-space:nowrap}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,#705438,#19150f 76%);text-align:center;transition:opacity .4s}
.loadcard{width:min(360px,92vw);padding:25px 23px;border:1px solid var(--edge);border-radius:18px;background:#12191deF;box-shadow:0 18px 55px #0009}
.loadcard h1{margin:0;color:var(--gold);font-size:34px;letter-spacing:7px}
.loadcard p{margin:9px 0 15px;color:#eee0c3;font-size:12px;line-height:1.5}
#loadbar{height:4px;background:#fff2;border-radius:8px;overflow:hidden}
#loadfill{height:100%;width:20%;background:linear-gradient(90deg,#9c713a,#f6d996);transition:width .25s}
#retry{display:none;margin:14px auto 0;width:auto;height:auto;padding:11px 17px;border-radius:10px;font-size:11px}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:#17130f;color:white;place-items:center;text-align:center;padding:30px;font-size:14px}
@media(orientation:portrait){#rotate{display:grid}}
@media(orientation:landscape) and (max-height:430px){
 .brand{top:7px}.panel{top:7px;padding:7px 10px}.panel b{margin-bottom:2px}
 #counter{top:55px}.actions{bottom:max(8px,env(safe-area-inset-bottom))}
 #stick{width:82px;height:82px}button{width:47px;height:47px}button.primary{width:55px;height:55px}
 #help{display:none}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">MEDJAY'i oynamak için telefonu yatay çevir.</div>
<div id="hud">
  <div class="brand">MEDJAY<small>ANTİK MISIR KEŞFİ</small></div>
  <div class="panel"><b id="missionLabel">ANA GÖREV</b><span id="mission">Altı kutsal eseri bul ve Karnak Tapınağı'na ulaş.</span></div>
  <div id="counter">KUTSAL ESERLER &nbsp;<strong><span id="found">0</span> / 6</strong></div>
  <div id="toast"></div>
  <div id="stick"><div id="nub"></div></div>
  <div class="actions"><button id="run">KOŞ</button><button id="jump">ZIPLA</button><button class="primary" id="act">İNCELE</button></div>
  <div id="help">SOL JOYSTICK: HAREKET &nbsp; • &nbsp; SAĞ TARAFI SÜRÜKLE: KAMERA &nbsp; • &nbsp; İNCELE: ETKİLEŞİM</div>
</div>
<div id="loading"><div class="loadcard"><h1>MEDJAY</h1><p id="loadtext">Antik Mısır dünyası hazırlanıyor…</p><div id="loadbar"><div id="loadfill"></div></div><button id="retry">TEKRAR DENE</button></div></div>

<script type="module">
const $ = id => document.getElementById(id);
const loading = $('loading');
const loadText = $('loadtext');
const loadFill = $('loadfill');
const retry = $('retry');

function bootError(error){
  console.error('MEDJAY startup error:', error);
  loadText.textContent = 'Oyun motoru başlatılamadı. İnternet bağlantısını kontrol edip tekrar deneyebilirsin. Ayrıntı: ' + (error?.message || error);
  loadFill.style.width = '100%';
  retry.style.display = 'block';
}
retry.addEventListener('click', () => location.reload());

import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')
.then(THREE => startGame(THREE))
.catch(bootError);

function startGame(THREE){
  const root = $('game');
  let renderer, scene, camera, clock, player;
  let yaw = 0, pitch = .2, joy = {x:0,y:0}, running = false;
  let jumpVelocity = 0, grounded = true, lookPointer = null;
  let found = 0, gameWon = false;
  const relics = [];
  const npcWanderers = [];
  const up = new THREE.Vector3(0,1,0);

  const mat = (color, roughness=.88, metalness=0) =>
    new THREE.MeshStandardMaterial({color, roughness, metalness});
  const M = {
    sand:mat(0xd9b87c), paleSand:mat(0xe6c996), sandstone:mat(0xc6aa7b),
    edgeStone:mat(0xa78c63), darkStone:mat(0x806447), mud:mat(0xb68d61),
    roof:mat(0x8e6948), skin:mat(0x986847), linen:mat(0xd9c69d),
    linenShade:mat(0xa88f68), leather:mat(0x483020), gold:mat(0xd4a84f,.35,.62),
    blue:mat(0x244d62), green:mat(0x526a3d), black:mat(0x29221b),
    water:new THREE.MeshStandardMaterial({color:0x3b9da9,roughness:.2,metalness:.12})
  };
  const toast = msg => {
    const el=$('toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),2300);
  };
  const add = (geometry, material, x, y, z, parent=scene) => {
    const mesh=new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true;
    parent.add(mesh); return mesh;
  };
  const box = (w,h,d,material,x,y,z,parent=scene) =>
    add(new THREE.BoxGeometry(w,h,d),material,x,y,z,parent);
  const cyl = (top,bottom,height,material,x,y,z,parent=scene,segments=12) =>
    add(new THREE.CylinderGeometry(top,bottom,height,segments),material,x,y,z,parent);
  const sphere = (radius,material,x,y,z,parent=scene,segments=14) =>
    add(new THREE.SphereGeometry(radius,segments,Math.max(8,segments-2)),material,x,y,z,parent);

  function makeMedjay(){
    const g=new THREE.Group(), legs=[], arms=[];
    const bronze=mat(0x8b6035,.48,.55), leatherDark=mat(0x39271d), clothRed=mat(0x74382b);
    // Legs, sandals and articulated knees
    for(const side of [-1,1]){
      const leg=new THREE.Group(); leg.position.set(side*.19,.84,0);
      add(new THREE.CapsuleGeometry(.115,.56,5,10),M.skin,0,-.25,0,leg);
      const knee=sphere(.12,M.skin,0,-.02,.015,leg,10);
      box(.28,.1,.43,leatherDark,0,-.62,.075,leg);
      box(.29,.055,.28,M.gold,0,-.56,.12,leg);
      const shinGuard=box(.22,.32,.08,bronze,0,-.36,.115,leg);
      g.add(leg); legs.push(leg);
    }
    // Arms with leather/bronze bracers
    for(const side of [-1,1]){
      const arm=new THREE.Group(); arm.position.set(side*.39,1.9,0);
      const upper=add(new THREE.CapsuleGeometry(.115,.48,5,10),M.skin,0,-.24,0,arm);
      upper.rotation.z=side*.12;
      const bracer=cyl(.135,.12,.32,bronze,0,-.47,.01,arm,10);
      const trim=cyl(.14,.14,.055,M.gold,0,-.33,.01,arm,10);
      const wrist=cyl(.13,.13,.09,M.gold,0,-.63,.01,arm,10);
      g.add(arm); arms.push(arm);
    }
    // Tunic, chest armor and layered waist cloth
    add(new THREE.CapsuleGeometry(.34,.66,6,14),M.linenShade,0,1.68,0,g);
    const chest=add(new THREE.CapsuleGeometry(.31,.38,5,12),mat(0x806044),0,1.82,.12,g);
    chest.scale.set(1.02,.9,.82);
    box(.68,.16,.46,leatherDark,0,1.32,0,g);
    box(.74,.12,.49,M.gold,0,1.42,0,g);
    const kilt=add(new THREE.CylinderGeometry(.34,.48,.68,12),M.linen,0,1.08,0,g);
    const frontPanel=box(.43,.58,.075,M.linenShade,0,1.02,.25,g);
    frontPanel.rotation.x=-.12;
    const sideCloth=box(.16,.57,.08,clothRed,.34,1.04,.06,g);sideCloth.rotation.z=-.12;
    // Diagonal chest strap and medallion
    const strap=box(.105,1.12,.09,leatherDark,-.12,1.75,.31,g);strap.rotation.z=-.42;
    const strapEdge=box(.035,1.1,.025,M.gold,-.18,1.76,.365,g);strapEdge.rotation.z=-.42;
    const medallion=cyl(.12,.12,.06,M.gold,.16,1.57,.39,g,12);medallion.rotation.x=Math.PI/2;
    // Shoulder guards
    for(const side of [-1,1]){
      const pad=sphere(.2,bronze,side*.38,2.02,0,g,12);pad.scale.set(1,.58,.95);
      sphere(.07,M.gold,side*.39,2.1,.13,g,8);
    }
    // Back cape, split lower tails
    const capeMat=clothRed.clone();capeMat.side=THREE.DoubleSide;
    const capeGeo=new THREE.BufferGeometry();
    const capeVerts=new Float32Array([
      -.28,2.03,-.16, .28,2.03,-.16,
      -.48,.58,-.35, .48,.58,-.35,
      -.28,.15,-.26, .28,.15,-.26
    ]);
    capeGeo.setAttribute('position',new THREE.BufferAttribute(capeVerts,3));
    capeGeo.setIndex([0,2,1,1,2,3,2,4,3,3,4,5]);capeGeo.computeVertexNormals();
    const cape=new THREE.Mesh(capeGeo,capeMat);cape.castShadow=true;g.add(cape);
    // Head, wrapped nemes-style headcloth and face details
    cyl(.13,.14,.22,M.skin,0,2.16,0,g,12);
    sphere(.225,M.skin,0,2.42,0,g,16);
    const hair=sphere(.238,M.black,0,2.45,0,g,16);hair.scale.set(1,.82,1);
    const cap=add(new THREE.SphereGeometry(.27,18,12,0,Math.PI*2,0,Math.PI*.58),M.blue,0,2.48,0,g);
    for(const side of [-1,1]){
      const flap=box(.19,.68,.18,M.blue,side*.25,2.03,.005,g);flap.rotation.z=side*.1;
      for(let i=0;i<3;i++)box(.2,.035,.19,M.gold,side*.25,2.28-i*.14,.105,g);
      sphere(.028,M.gold,side*.2,2.5,.17,g,8);
    }
    for(const x of [-.09,.09]){
      sphere(.025,M.black,x,2.42,.205,g,8);
      box(.075,.018,.025,M.black,x,2.47,.205,g);
    }
    const beard=add(new THREE.ConeGeometry(.065,.2,8),M.black,0,2.22,.19,g);beard.rotation.x=-.12;
    // Sword and sheath on the left hip
    const sheath=box(.11,.78,.13,leatherDark,-.43,1.12,-.02,g);sheath.rotation.z=-.28;
    const hilt=cyl(.045,.045,.28,M.gold,-.52,1.58,-.02,g,8);hilt.rotation.z=Math.PI/2;
    box(.23,.06,.07,M.gold,-.52,1.57,-.02,g);
    g.userData={legs,arms,cape};return g;
  }
  function palm(x,z){
    cyl(.27,.42,6.5,mat(0x75502e),x,3.25,z);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      const leaf=add(new THREE.ConeGeometry(.5,5.7,6),M.green,
        x+Math.cos(a)*1.6,6.1,z+Math.sin(a)*1.6);
      leaf.rotation.z=-Math.PI/2.8; leaf.rotation.y=a;
    }
  }
  function pyramid(x,z,size,color=0xb99b6d){
    const group=new THREE.Group(); scene.add(group); group.position.set(x,0,z);
    const p=add(new THREE.ConeGeometry(size,size*1.24,4),mat(color),0,size*.62,0,group);
    p.rotation.y=Math.PI/4;
    for(let i=1;i<=5;i++){
      const width=size*(1-i*.13);
      const y=size*1.24*(1-i*.14);
      const course=box(width*1.42,.25,width*1.42,M.sandstone,0,y,0,group);
      course.rotation.y=Math.PI/4;
    }
    return group;
  }
  function sphinx(x,z,scale=1){
    const g=new THREE.Group(); scene.add(g); g.position.set(x,0,z); g.scale.setScalar(scale);
    box(10,1.6,3.8,M.edgeStone,0,.8,0,g);
    box(8.5,2.1,3.1,M.sandstone,-.2,2.35,0,g);
    box(2.2,2.7,2.1,M.sandstone,3.3,4.35,0,g);
    const headcloth=box(2.7,1.2,2.3,M.blue,3.3,5.35,0,g);
    for(const side of [-1,1]) box(.65,1.8,2.15,M.blue,3.3+side*1.45,4.6,0,g);
    return g;
  }
  function temple(){
    const x=8,z=-138;
    box(54,2,36,M.darkStone,x,1,z);
    box(50,15,2.5,M.sandstone,x,8.5,z-17);
    box(52,2,6,M.edgeStone,x,16,z-15);
    for(let i=0;i<10;i++){
      const px=x-22+i*4.9;
      cyl(.82,1.08,11.5,M.sandstone,px,7.7,z+7,scene,14);
      cyl(1.3,1.05,1.05,M.gold,px,13.85,z+7,scene,12);
      cyl(1.05,.9,.45,M.edgeStone,px,1.3,z+7,scene,12);
    }
    box(9,18,7,M.edgeStone,-22,9,z-7);
    box(9,18,7,M.edgeStone,38,9,z-7);
    box(13,2.2,7,M.gold,8,18.7,z-7);
    for(let i=0;i<6;i++){
      box(2.2,1.1,1.4,M.edgeStone,8,4+i*1.5,z-17.8);
    }
    const ob=add(new THREE.CylinderGeometry(.35,.75,19,4),M.gold,-31,9.5,-116);
    ob.rotation.y=Math.PI/4;
    const tip=add(new THREE.ConeGeometry(.55,1.8,4),M.gold,-31,19.9,-116);tip.rotation.y=Math.PI/4;
  }
  function jar(x,z,color=0x93613b){
    const jm=mat(color,.72,.05);
    const g=new THREE.Group(); scene.add(g);g.position.set(x,0,z);
    cyl(.3,.42,.65,jm,0,.4,0,g,10);
    sphere(.31,jm,0,.72,0,g,10).scale.y=.75;
    cyl(.13,.13,.12,M.gold,0,.96,0,g,10);
  }
  function makeDune(x,z,rx,rz,height,seed=1){
    const rings=12,segments=40,verts=[],indices=[];
    for(let r=0;r<=rings;r++){
      const t=r/rings;
      for(let i=0;i<=segments;i++){
        const a=i/segments*Math.PI*2;
        const wav=1+.055*Math.sin(a*3+seed)+.035*Math.cos(a*5-seed);
        const rr=t*wav;
        const y=height*Math.pow(Math.max(0,1-t*t),1.55)*(0.94+.06*Math.sin(a*2+seed));
        verts.push(Math.cos(a)*rx*rr,y,Math.sin(a)*rz*rr);
      }
    }
    for(let r=0;r<rings;r++)for(let i=0;i<segments;i++){
      const a=r*(segments+1)+i,b=a+segments+1;
      indices.push(a,b,a+1,b,b+1,a+1);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(indices);geo.computeVertexNormals();
    const mesh=new THREE.Mesh(geo,mat(0xcaa36e));
    mesh.position.set(x,-.12,z);mesh.receiveShadow=true;mesh.castShadow=true;
    scene.add(mesh);return mesh;
  }

  function createWorld(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x9fc6d4);
    scene.fog=new THREE.Fog(0xd8bd8d,115,360);
    scene.add(new THREE.HemisphereLight(0xffe9ce,0x725333,2.05));
    const sun=new THREE.DirectionalLight(0xffdfad,2.7);
    sun.position.set(-65,95,35); sun.castShadow=true;
    sun.shadow.mapSize.set(1536,1536);
    sun.shadow.camera.left=-115; sun.shadow.camera.right=115;
    sun.shadow.camera.top=115; sun.shadow.camera.bottom=-115;
    scene.add(sun);
    const floor=add(new THREE.PlaneGeometry(800,800),M.sand,0,-.18,-115);
    floor.rotation.x=-Math.PI/2; floor.receiveShadow=true;

    for(let i=0;i<50;i++){
      const d=sphere(1, [M.sand,M.paleSand,M.sandstone][i%3],
        (Math.random()-.5)*420,-2.6,-30-Math.random()*360,scene,12);
      d.scale.set(15+Math.random()*30,2.3+Math.random()*4.8,10+Math.random()*24);
    }
    // Sculpted dune ridges frame the playable valley without blocking the main routes.
    [
      [-150,-35,48,34,12,1],[-118,-92,38,25,9,2],[-178,-165,54,38,16,3],
      [155,-42,52,32,13,4],[174,-118,46,31,12,5],[145,-205,62,42,18,6],
      [-205,-265,58,44,19,7],[205,-310,70,48,21,8],[-92,85,42,27,10,9],
      [100,95,48,30,11,10],[-235,-65,52,34,14,11],[235,-150,58,40,17,12]
    ].forEach(v=>makeDune(...v));
    // Wind-carved smaller ridges and stone outcrops.
    for(let i=0;i<34;i++){
      const x=(Math.random()-.5)*340,z=-25-Math.random()*300;
      const rock=sphere(.8,M.edgeStone,x,.25,z,scene,9);
      rock.scale.set(1.5+Math.random()*2,.55+Math.random()*.6,1+Math.random()*2);
      rock.rotation.y=Math.random()*Math.PI;
    }
    pyramid(-105,-195,39); pyramid(115,-260,53); pyramid(-185,-315,48); pyramid(-55,-125,25,0xc4a779);

    // Ancient village
    for(let i=0;i<12;i++){
      const x=-48+(i%4)*13,z=-23-Math.floor(i/4)*14;
      box(8.5,4.7,7.4,M.mud,x,2.35,z);
      box(9,.42,7.8,M.roof,x,4.9,z);
      box(1.3,2.4,M.leather,x,1.2,z+3.77);
      for(let w=0;w<2;w++) box(.8,1.1,.12,M.blue,x-2+w*4,2.6,z+3.78);
    }
    // Market, pottery and awnings
    for(let i=0;i<5;i++){
      const x=-58+i*18,z=17+(i%2)*6;
      box(8,.3,5,M.darkStone,x,.15,z);
      box(8,.18,5,M.blue,x,3.5,z);
      cyl(.12,.12,3,M.leather,x-3.5,1.9,z);
      cyl(.12,.12,3,M.leather,x+3.5,1.9,z);
      jar(x-1,z+1.5,0x9b613d); jar(x+1,z+1.5,0xa7794d);
    }
    // Oasis pool and palms
    const water=add(new THREE.CircleGeometry(14,48),M.water,31,.03,-31);
    water.rotation.x=-Math.PI/2;
    for(let i=0;i<11;i++){
      const a=i*Math.PI*2/11;
      palm(31+Math.cos(a)*18,-31+Math.sin(a)*18);
    }
    // Karnak temple and sphinx avenue
    temple();
    for(let i=0;i<9;i++){
      const x=-35+i*11,z=-83;
      box(4.2,1.2,2.5,M.darkStone,x,.6,z);
      box(2.7,1.7,2,M.sandstone,x,2,z);
      box(1.45,2.1,1.45,M.sandstone,x+1.2,3.6,z);
    }
    sphinx(-62,-102,1.15); sphinx(65,-102,1.15); sphinx(-80,-153,.8);
    // Ruined columns and scattered rocks
    for(let i=0;i<32;i++){
      const x=(Math.random()-.5)*210,z=-48-Math.random()*195;
      if(Math.abs(x)<35 && z<-120 && z>-170) continue;
      const h=1+Math.random()*4.5;
      cyl(.35,.58,h,M.edgeStone,x,h/2,z);
      cyl(.72,.6,.3,M.sandstone,x,h+.12,z);
    }
    for(let i=0;i<35;i++){
      const x=(Math.random()-.5)*190,z=-25-Math.random()*190;
      const rock=sphere(.7,M.edgeStone,x,.3,z,scene,8);
      rock.scale.set(1.2,.65,.8);
    }
    // Obelisks, fire bowls and decorative standards
    const o=add(new THREE.CylinderGeometry(.45,.75,16,4),M.gold,(-15),8,-91);o.rotation.y=Math.PI/4;
    for(let i=0;i<5;i++){
      const x=-65+i*32,z=35;
      cyl(.6,.8,.45,M.darkStone,x,.22,z);
      const flame=add(new THREE.ConeGeometry(.32,1.3,7),mat(0xd8782c),x,.95,z);
      flame.userData.flicker=true;
    }
    // NPCs
    for(let i=0;i<5;i++){
      const npc=makeMedjay(); npc.scale.setScalar(.82);
      npc.position.set(-32+i*15,0,-15-(i%2)*9); scene.add(npc);
      npcWanderers.push({npc,home:npc.position.clone(),phase:i*1.8});
    }

    player=makeMedjay(); player.position.set(0,0,13); scene.add(player);

    // Six relics on pedestals
    const positions=[[-74,-56],[-40,21],[15,-61],[55,-108],[99,-50],[122,-132]];
    positions.forEach(([x,z],i)=>{
      const group=new THREE.Group(); scene.add(group);
      cyl(.58,.76,.26,M.darkStone,0,.13,0,group,10);
      const gemMat=new THREE.MeshStandardMaterial({color:[0xffd26a,0x55d8dc,0xb98aff,0xf08c52,0x80d99b,0xe4c1ff][i],metalness:.62,roughness:.18,emissive:0x553000});
      add(new THREE.OctahedronGeometry(.5),gemMat,0,.95,0,group);
      const light=new THREE.PointLight(0xf4c76a,1.15,7); light.position.y=1; group.add(light);
      group.position.set(x,0,z);
      relics.push({group,found:false});
    });
    // Temple quest marker
    const marker=new THREE.Group(); scene.add(marker);
    cyl(.13,.13,3.2,M.gold,0,1.6,0,marker,8);
    const halo=add(new THREE.TorusGeometry(1.5,.09,8,32),M.gold,0,.12,0,marker);
    halo.rotation.x=Math.PI/2; marker.position.set(8,0,-132);
    marker.userData.halo=halo;
  }


  async function loadDetailedModels(){
    const {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js');
    const loader=new GLTFLoader();
    const assets=[
      {file:'great-sandstone-sphinx.glb',x:-83,z:-112,size:20},
      {file:'desert-step-pyramid.glb',x:-145,z:-215,size:36},
      {file:'desert-temple-hall.glb',x:12,z:-205,size:34},
      {file:'pharaoh-colossi-gate.glb',x:72,z:-155,size:24},
      {file:'desert-camel-caravan.glb',x:-48,z:48,size:17},
      {file:'desert-bazaar-stall.glb',x:-58,z:34,size:12},
      {file:'desert-tomb-entrance.glb',x:116,z:-78,size:19},
      {file:'desert-obelisk-set.glb',x:67,z:-218,size:17},
      {file:'desert-oasis-camp.glb',x:75,z:35,size:22},
      {file:'sandstone-ruin-kit.glb',x:-112,z:-65,size:18}
    ];
    let loaded=0;
    const jobs=assets.map(item=>new Promise(resolve=>{
      loader.load('./'+item.file,gltf=>{
        const model=gltf.scene;
        model.updateMatrixWorld(true);
        let bounds=new THREE.Box3().setFromObject(model);
        const dims=new THREE.Vector3(); bounds.getSize(dims);
        const maxDim=Math.max(dims.x,dims.y,dims.z);
        if(!Number.isFinite(maxDim)||maxDim<.001){resolve(false);return}
        const targetScale=item.size/maxDim;
        model.scale.setScalar(targetScale);
        model.updateMatrixWorld(true);
        bounds=new THREE.Box3().setFromObject(model);
        const center=new THREE.Vector3();bounds.getCenter(center);
        model.position.set(item.x-center.x*targetScale,-bounds.min.y,item.z-center.z*targetScale);
        model.traverse(o=>{
          if(o.isMesh){
            o.castShadow=false;o.receiveShadow=false;
            if(o.material){o.material.side=THREE.FrontSide}
          }
        });
        scene.add(model);
        loaded++;resolve(true);
      },undefined,err=>{console.warn('Model yüklenemedi:',item.file,err);resolve(false)});
    }));
    const results=await Promise.all(jobs);
    const success=results.filter(Boolean).length;
    if(success) toast(`${success} yüksek detaylı Mısır modeli yüklendi.`);
    else toast('3D modeller yüklenemedi; temel dünya açık.');
    return success;
  }

  function resize(){
    if(!renderer||!camera) return;
    const w=Math.max(1,root.clientWidth||innerWidth);
    const h=Math.max(1,root.clientHeight||innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  function showGame(){
    loadFill.style.width='100%';
    loading.style.opacity='0';
    setTimeout(()=>loading.remove(),450);
    toast('Keşif başladı. Altı kutsal eseri bul!');
  }
  function interact(){
    if(gameWon) return;
    let nearest=null,dist=1e9;
    for(const r of relics){
      if(r.found) continue;
      const d=player.position.distanceTo(r.group.position);
      if(d<dist){dist=d;nearest=r}
    }
    if(nearest&&dist<6){
      nearest.found=true; nearest.group.visible=false; found++;
      $('found').textContent=found;
      if(found===6){
        $('missionLabel').textContent='SON AŞAMA';
        $('mission').textContent='Altı eser sende. Karnak Tapınağı girişindeki altın işarete ulaş.';
        toast('Altı kutsal eser tamamlandı. Tapınağa dön!');
      } else toast(`Kutsal eser bulundu — ${found}/6`);
      return;
    }
    if(found===6 && player.position.distanceTo(new THREE.Vector3(8,0,-132))<13){
      gameWon=true;
      $('missionLabel').textContent='GÖREV TAMAMLANDI';
      $('mission').textContent='Medjay kayıp eserleri korudu. Mısır’ın sırları yeniden güvende.';
      toast('Görev tamamlandı! Medjay’in adı efsaneye dönüştü.');
      return;
    }
    toast('İncelenecek bir eser için biraz daha yaklaş.');
  }
  function controls(){
    const stick=$('stick'),nub=$('nub');
    function updateStick(e){
      const r=stick.getBoundingClientRect();
      let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
      const max=r.width*.34,len=Math.hypot(dx,dy);
      if(len>max){dx*=max/len;dy*=max/len}
      joy.x=dx/max; joy.y=dy/max;
      nub.style.transform=`translate(${dx}px,${dy}px)`;
    }
    function resetStick(){joy={x:0,y:0};nub.style.transform='translate(0,0)'}
    stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);updateStick(e)});
    stick.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)updateStick(e)});
    stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
    const run=$('run');
    run.addEventListener('pointerdown',e=>{e.preventDefault();running=true;run.classList.add('active')});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>run.addEventListener(ev,()=>{running=false;run.classList.remove('active')}));
    $('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(grounded){jumpVelocity=7.4;grounded=false}});
    $('act').addEventListener('click',interact);
    renderer.domElement.addEventListener('pointerdown',e=>{
      if(e.clientX>innerWidth*.38) lookPointer={x:e.clientX,y:e.clientY};
    });
    renderer.domElement.addEventListener('pointermove',e=>{
      if(lookPointer){
        yaw-=(e.clientX-lookPointer.x)*.006;
        pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lookPointer.y)*.002,-.08,.62);
        lookPointer={x:e.clientX,y:e.clientY};
      }
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>lookPointer=null));
    addEventListener('keydown',e=>{
      if(e.key==='Shift')running=true;
      if(e.key==='e'||e.key==='E')interact();
      if(e.key===' '&&grounded){jumpVelocity=7.4;grounded=false}
    });
    addEventListener('keyup',e=>{if(e.key==='Shift')running=false});
  }
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
    for(const r of relics){
      if(!r.found){r.group.rotation.y+=dt*.72;r.group.position.y=.1+Math.sin(t*2+r.group.position.x)*.1}
    }
    npcWanderers.forEach(({npc,home,phase})=>{
      npc.position.x=home.x+Math.sin(t*.24+phase)*1.1;
      npc.rotation.y=Math.sin(t*.24+phase)*.16;
    });
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const direction=forward.multiplyScalar(-joy.y).add(right.multiplyScalar(joy.x));
    const moving=direction.lengthSq()>.01;
    if(moving){
      direction.normalize();
      const speed=running?9.8:5.1;
      player.position.addScaledVector(direction,speed*dt);
      player.rotation.y=Math.atan2(direction.x,direction.z);
      const gait=t*(running?13:9);
      player.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(gait+i*Math.PI)*.52);
      player.userData.arms.forEach((a,i)=>a.rotation.x=Math.sin(gait+i*Math.PI+Math.PI)*.3);
    }else{
      player.userData.legs.forEach(l=>l.rotation.x=THREE.MathUtils.damp(l.rotation.x,0,8,dt));
      player.userData.arms.forEach(a=>a.rotation.x=THREE.MathUtils.damp(a.rotation.x,0,8,dt));
    }
    if(!grounded){
      player.position.y+=jumpVelocity*dt;
      jumpVelocity-=18*dt;
      if(player.position.y<=0){player.position.y=0;jumpVelocity=0;grounded=true}
    }
    player.position.x=THREE.MathUtils.clamp(player.position.x,-220,220);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-360,100);
    const desired=new THREE.Vector3(
      player.position.x+Math.sin(yaw)*8.7,
      player.position.y+4.15+pitch*5,
      player.position.z+Math.cos(yaw)*8.7
    );
    camera.position.lerp(desired,1-Math.pow(.001,dt));
    camera.lookAt(player.position.x,1.4+player.position.y,player.position.z);
    renderer.render(scene,camera);
  }
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
    root.appendChild(renderer.domElement);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.12;
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    camera=new THREE.PerspectiveCamera(60,1,.1,750);
    clock=new THREE.Clock();
    createWorld();
    resize(); controls(); animate();
    loadDetailedModels().catch(err=>{console.warn(err);toast('Ek modeller yüklenemedi; temel oyun çalışıyor.')});
    addEventListener('resize',resize);
    addEventListener('orientationchange',()=>setTimeout(resize,220));
    if(window.visualViewport) visualViewport.addEventListener('resize',resize);
    renderer.domElement.addEventListener('webglcontextlost',e=>{
      e.preventDefault(); bootError(new Error('Grafik belleği sıfırlandı. Sayfayı yenileyip tekrar dene.'));
    });
    showGame();
  }catch(error){bootError(error)}
}
</script>
