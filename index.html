<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MEDJAY - Antik Mısır</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#c69b68;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block}
#loading{position:fixed;inset:0;background:#17130e;display:grid;place-items:center;text-align:center;color:#e9c58c;font-size:22px;z-index:10}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#21190fdd;border:1px solid #d9b47b;border-radius:12px;padding:10px}
#top{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
#quest{max-width:70%}
#stick{position:absolute;bottom:24px;left:20px;width:125px;height:125px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff99;pointer-events:auto}
#nub{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#e9d2a8;border:2px solid white}
#buttons{position:absolute;right:15px;bottom:30px;display:flex;gap:8px;pointer-events:auto}
button{width:66px;height:66px;border-radius:50%;background:#302216;color:white;border:2px solid #e7c18a;font-weight:bold;font-size:11px}
#hint{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);opacity:0;transition:.2s;font-size:12px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="loading">MEDJAY<br><br>Antik Mısır yükleniyor...</div>
<div id="hud">
 <div id="top">
  <div class="panel" id="quest">GÖREV: Hassan'ı bul ve kayıp emanetleri araştır.</div>
  <div class="panel">♥ <span id="health">100</span><br>MEDJAY</div>
 </div>
 <div id="toast" class="panel"></div>
 <div id="hint" class="panel">Sol: Hareket · Sağ: Kamera</div>
 <div id="stick"><div id="nub"></div></div>
 <div id="buttons">
  <button id="attack">KILIÇ</button>
  <button id="interact">ETKİLEŞ</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd7b27e);
scene.fog=new THREE.FogExp2(0xc8a16d,.002);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe6c2,0x73502e,2));
const sun=new THREE.DirectionalLight(0xffd49a,3);
sun.position.set(-100,140,80);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.95});
const sand=mat(0xcba875),rock=mat(0x927653),stone=mat(0xb69b76);
function groundHeight(x,z){
 return Math.sin(x*.026)*2.5+Math.cos(z*.03)*2.8+
 Math.sin((x+z)*.018)*1.6+Math.sin(x*.075+z*.035)*.5;
}

// Dalgalı çöl zemini
const N=160,S=440,pos=[],idx=[];
for(let z=0;z<=N;z++){
 for(let x=0;x<=N;x++){
  let px=(x/N-.5)*S,pz=(z/N-.5)*S;
  pos.push(px,groundHeight(px,pz),pz);
  if(x<N&&z<N){
   let a=z*(N+1)+x,b=a+1,c=a+N+1,d=c+1;
   idx.push(a,c,b,b,c,d);
  }
 }
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
geo.setIndex(idx);geo.computeVertexNormals();
const floor=new THREE.Mesh(geo,sand);
floor.receiveShadow=true;scene.add(floor);

// Kum tepeleri
for(let i=0;i<48;i++){
 let x=(Math.random()-.5)*390,z=(Math.random()-.5)*390;
 let dune=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),i%3? sand:rock);
 dune.scale.set(15+Math.random()*22,1+Math.random()*2.5,6+Math.random()*10);
 dune.position.set(x,groundHeight(x,z)-.5,z);
 dune.rotation.y=Math.random()*Math.PI;
 scene.add(dune);
}

// Çöl taşları
for(let i=0;i<120;i++){
 let x=(Math.random()-.5)*370,z=(Math.random()-.5)*370;
 let m=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*1.8),rock);
 m.position.set(x,groundHeight(x,z)+.2,z);
 m.scale.y=.5+Math.random()*.5;
 m.rotation.set(Math.random(),Math.random(),Math.random());
 m.castShadow=true;scene.add(m);
}

// Uzak piramit silüetleri
function pyramid(x,z,size,h){
 const g=new THREE.Group();
 for(let i=0;i<18;i++){
  let t=i/18,half=size*(1-t);
  let m=new THREE.Mesh(new THREE.CylinderGeometry(.01,half,h/18*1.1,4),mat(i%2?0xc5a77d:0xb99a70));
  m.rotation.y=Math.PI/4;
  m.position.y=(i+.5)*h/18;
  m.castShadow=true;g.add(m);
 }
 g.position.set(x,groundHeight(x,z),z);scene.add(g);
}
pyramid(-100,-85,29,48);
pyramid(-137,-120,18,30);

// Vaha
const water=new THREE.Mesh(new THREE.CircleGeometry(13,48),new THREE.MeshStandardMaterial({color:0x347f82,roughness:.25}));
water.rotation.x=-Math.PI/2;
water.position.set(50,groundHeight(50,-35)+.3,-35);
water.scale.set(1,.7,1);scene.add(water);

// GLB modelleri - Türkçe ve İngilizce isimleri sırayla denenir.
const loader=new GLTFLoader();
function loadModel(names,x,z,height,rotation=0){
 return new Promise(resolve=>{
  let n=0;
  function attempt(){
   if(n>=names.length){console.warn('Model bulunamadı:',names);resolve(null);return}
   const file=names[n++];
   loader.load('./'+encodeURIComponent(file),g=>{
    const obj=g.scene;
    const box=new THREE.Box3().setFromObject(obj);
    const size=new THREE.Vector3();box.getSize(size);
    const scale=height/Math.max(size.y,.001);
    obj.scale.setScalar(scale);
    const b2=new THREE.Box3().setFromObject(obj);
    obj.position.set(x,groundHeight(x,z)-b2.min.y,z);
    obj.rotation.y=rotation;
    obj.traverse(o=>{
     if(o.isMesh){o.castShadow=true;o.receiveShadow=true}
    });
    scene.add(obj);resolve(obj);
   },undefined,attempt);
  }
  attempt();
 });
}

const models=[
 [['çöl-adım-piramidi.glb','desert-step-pyramid.glb'],-65,-65,28,0],
 [['great-sandstone-sphinx.glb','büyük-kumtaşı-sfenksi.glb'],-42,-58,12,0],
 [['çöl-tapınağı-salon.glb','desert-temple-hall.glb'],70,-55,20,Math.PI],
 [['pharaoh-colossi-gate.glb','firavun-dev-heykeller-kapısı.glb'],82,-34,18,0],
 [['çöl-mezarlığı-girişi.glb','desert-tomb-entrance.glb'],-85,45,14,0],
 [['çöl-şehri-kapısı.glb','desert-city-gate.glb'],15,55,15,Math.PI],
 [['kerpiç-çöl-evi.glb','mud-brick-desert-house.glb'],28,40,9,0],
 [['çöl-bazar-tezgahı.glb','desert-bazaar-stall.glb'],38,37,7,0],
 [['çöl-vaha-kampı.glb','desert-oasis-camp.glb'],52,-35,14,0],
 [['çöl-dikilitaş-seti.glb','desert-obelisk-set.glb'],-20,10,14,0],
 [['kumtaşı-harabe-seti.glb','sandstone-ruin-kit.glb'],-15,-95,15,0],
 [['çöl-deve-kervanı.glb','desert-camel-caravan.glb'],-35,15,8,0],
 [['çöl-hayvanları-seti.glb','desert-animals-set.glb'],58,-22,7,0],
 [['çöl-oyulmuş-tabletler.glb','desert-carved-tablets.glb'],-80,42,5,0],
 [['çöl-çadır-kampı.glb','desert-tent-camp.glb'],45,-43,8,0],
 [['çöl-kuyu.glb','desert-well.glb'],24,52,5,0],
 [['çöl-kazı-alanı.glb','desert-dig-site.glb'],-72,40,8,0],
 [['gömülü-kamış-tekne.glb','buried-reed-boat.glb'],62,-30,6,0],
 [['çöl-taht-odası.glb','desert-throne-room.glb'],95,25,15,0],
 [['çöl-kaşif-kamyonu.glb','desert-explorer-truck.glb'],-45,65,6,0],
 [['çöl-hazine-kasası.glb','desert-treasure-vault.glb'],-105,30,8,0],
 [['kraliyet-çöl-lahdi.glb','royal-desert-sarcophagus.glb'],-90,55,5,0],
 [['mezar-tuzak-koridoru.glb','tomb-trap-corridor.glb'],-100,65,8,0],
 [['çöl-mezarlığı-arazi-kiti.glb','desert-tomb-terrain-kit.glb'],-115,45,12,0],
 [['çöl-emanetleri-seti.glb','desert-relics-set.glb'],85,-75,7,0]
];
await Promise.all(models.map(m=>loadModel(...m)));

// İnsan karakterleri: yüz, göz, burun, saç, sakal, kollar ve eller.
const skin=mat(0x986744),hair=mat(0x241910),dark=mat(0x443329);
function human(x,z,color){
 const g=new THREE.Group(),clothes=mat(color);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.65,4,9),clothes);
 body.position.y=1.25;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.235,16,12),skin);
 head.position.y=1.96;g.add(head);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.245,14,10),hair);
 cap.scale.y=.52;cap.position.set(0,2.08,-.025);g.add(cap);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.05,.14,6),skin);
 nose.rotation.x=Math.PI/2;nose.position.set(0,1.95,.22);g.add(nose);
 const beard=new THREE.Mesh(new THREE.ConeGeometry(.12,.23,8),hair);
 beard.position.set(0,1.75,.17);g.add(beard);
 for(const s of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.027,8,6),mat(0x17120e));
  eye.position.set(s*.085,2.005,.205);g.add(eye);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.48,3,7),skin);
  arm.position.set(s*.39,1.35,0);arm.rotation.z=s*.17;g.add(arm);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.105,9,7),skin);
  hand.position.set(s*.41,1.02,.015);g.add(hand);
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,3,7),dark);
  leg.position.set(s*.16,.45,0);g.add(leg);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.18,.1,.3),dark);
  foot.position.set(s*.16,.12,.08);g.add(foot);
 }
 g.position.set(x,groundHeight(x,z),z);
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});
 scene.add(g);return g;
}
const player=human(0,12,0x80613f);
const hassan=human(30,36,0xd6c39a);
const merchant=human(40,39,0x79513a);
let enemies=[human(-12,-12,0x59372a),human(-19,-17,0x633b2b)];

// Görev emanetleri
let relics=[[-78,45],[84,-35],[-20,-95]];
let relicMeshes=relics.map(([x,z])=>{
 const m=new THREE.Mesh(new THREE.OctahedronGeometry(1),new THREE.MeshStandardMaterial({color:0xffd34e,emissive:0x9c5b08,emissiveIntensity:1.5}));
 m.position.set(x,groundHeight(x,z)+2,z);scene.add(m);return m;
});
let found=0;

// Kontroller
let joy={x:0,y:0},yaw=0,pitch=.15,stickOn=false;
const stick=$('stick'),nub=$('nub');
function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy),k=Math.min(1,50/Math.max(len,1));
 joy.x=dx*k/50;joy.y=dy*k/50;
 nub.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`;
}
stick.addEventListener('pointerdown',e=>{stickOn=true;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(stickOn)moveStick(e)});
function stop(){stickOn=false;joy={x:0,y:0};nub.style.transform=''}
stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);

let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{
 if(drag){
  yaw-=(e.clientX-lx)*.005;
  pitch=Math.max(-.08,Math.min(.6,pitch+(e.clientY-ly)*.003));
  lx=e.clientX;ly=e.clientY;
 }
});
function toast(t){
 $('toast').textContent=t;$('toast').style.opacity=1;
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,2000);
}

$('attack').onclick=()=>{
 let i=enemies.findIndex(e=>e.position.distanceTo(player.position)<4.5);
 if(i>=0){scene.remove(enemies[i]);enemies.splice(i,1);toast('Düşman yenildi!')}
 else toast('Yakında düşman yok.');
};
$('interact').onclick=()=>{
 for(let i=0;i<relics.length;i++){
  const [x,z]=relics[i];
  if(Math.hypot(player.position.x-x,player.position.z-z)<10){
   scene.remove(relicMeshes[i]);
   relics.splice(i,1);relicMeshes.splice(i,1);found++;
   $('quest').textContent='EMANETLER: '+found+'/3';
   toast('Altın emanet bulundu!');
   if(found===3)toast('Görev tamamlandı! Hassan’a dön.');
   return;
  }
 }
 if(player.position.distanceTo(hassan.position)<8){
  $('quest').textContent='HASSAN: Üç altın emaneti bul ve bana getir.';
  toast('Hassan: Emanetler eski tapınaklarda saklı.');
 }else if(player.position.distanceTo(merchant.position)<8){
  toast('Tüccar: Çölde dikkatli ol, Medjay.');
 }else toast('Yakında etkileşilecek bir şey yok.');
};

// Oyun döngüsü
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const f=-joy.y,s=joy.x;
 const dx=s*Math.cos(yaw)-f*Math.sin(yaw);
 const dz=-s*Math.sin(yaw)-f*Math.cos(yaw);
 const len=Math.hypot(dx,dz);
 if(len>.05){
  player.position.x+=dx/len*dt*8;
  player.position.z+=dz/len*dt*8;
  player.rotation.y=Math.atan2(dx,dz);
 }
 player.position.y=groundHeight(player.position.x,player.position.z);
 enemies.forEach(e=>{
  if(e.position.distanceTo(player.position)<22){
   const v=player.position.clone().sub(e.position).normalize();
   e.position.add(v.multiplyScalar(dt*1.5));
   e.position.y=groundHeight(e.position.x,e.position.z);
  }
 });
 relicMeshes.forEach((r,i)=>{
  r.rotation.y+=dt;
  r.position.y=groundHeight(r.position.x,r.position.z)+2+Math.sin(clock.elapsedTime*2+i)*.25;
 });
 const target=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*9,
  player.position.y+4.2+pitch*5,
  player.position.z+Math.cos(yaw)*9
 );
 camera.position.lerp(target,.1);
 camera.lookAt(player.position.x,player.position.y+1.25,player.position.z);
 renderer.render(scene,camera);
}
animate();
$('loading').style.display='none';

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
