<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MEDJAY — Antik Mısır Keşfi</title>
<style>
:root{--gold:#e9c477}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c99c62;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block}#game{position:fixed;inset:0}#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(#18252d,#8e6540);color:#fff;text-align:center;padding:24px;transition:opacity .6s}#loading .card{max-width:360px;background:#111a20e8;border:1px solid #d5b36b66;border-radius:18px;padding:25px}#loading h1{font-size:28px;margin:0;color:var(--gold);letter-spacing:3px}#loading p{font-size:13px;line-height:1.5;opacity:.85}#bar{height:5px;background:#ffffff30;border-radius:8px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #352312}#brand{position:absolute;left:16px;top:12px;font-weight:900;letter-spacing:1px;font-size:clamp(15px,2.5vw,23px)}#brand small{display:block;font-size:9px;letter-spacing:2px;color:#f1d28f}#objective{position:absolute;right:13px;top:12px;background:#171a1bd9;border:1px solid #e7c47b66;border-radius:11px;padding:9px 12px;max-width:220px;font-size:11px}#objective b{display:block;color:#f1cf88;font-size:10px;margin-bottom:3px}#counter{position:absolute;left:17px;top:64px;font-size:12px}#toast{position:absolute;left:50%;top:23%;transform:translate(-50%,-10px);opacity:0;background:#171a1ddd;border:1px solid #e7c47b88;border-radius:12px;padding:10px 15px;font-size:12px;transition:.25s;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}#stick{position:absolute;left:max(17px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid #ffffff88;background:#ffffff20;pointer-events:auto}#nub{position:absolute;width:46px;height:46px;left:34px;top:34px;border-radius:50%;background:#fff9;border:2px solid white}#actions{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:end;pointer-events:auto}.action{width:61px;height:61px;border-radius:50%;border:1px solid #ffffff99;background:#211b17b8;color:#fff;font-weight:800;font-size:10px}.action:active{background:#9a672e}#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;opacity:.75;white-space:nowrap}#rotate{display:none;position:fixed;inset:0;background:#17130f;color:white;z-index:40;place-items:center;text-align:center;padding:30px}@media(orientation:portrait){#rotate{display:grid}}@media(orientation:landscape) and (max-height:500px){#stick{width:96px;height:96px}#nub{left:25px;top:25px;width:42px;height:42px}.action{width:54px;height:54px}#counter{top:53px}}
</style>
</head>
<body><div id="game"></div><div id="loading"><div class="card"><h1>MEDJAY</h1><b>ANTİK MISIR KEŞFİ</b><p id="loadtext">Çöl dünyası hazırlanıyor…</p><div id="bar"><i id="progress"></i></div></div></div><div id="rotate">Oyunu oynamak için telefonu yatay çevir.</div>
<div id="hud"><div id="brand">MEDJAY<small>ANTİK MISIR KEŞFİ</small></div><div id="objective"><b>ANA GÖREV</b>Kayıp kutsal eserleri bul ve tapınağa ulaş.</div><div id="counter">Eserler: <span id="found">0</span> / 6</div><div id="toast"></div><div id="stick"><div id="nub"></div></div><div id="actions"><button class="action" id="run">KOŞ</button><button class="action" id="interact">İNCELE</button></div><div id="hint">Sol joystick: hareket · Sağ tarafı sürükle: kamerayı çevir</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),root=$('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4d5);scene.fog=new THREE.Fog(0xd9b77f,.003,260);
const camera=new THREE.PerspectiveCamera( sixty=62,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe7c0,0x705037,2));const sun=new THREE.DirectionalLight(0xffdfaa,2.3);sun.position.set(-45,80,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const sand=mat(0xd6ad70),dark=mat(0x51402f),stone=mat(0xb9a078),water= new THREE.MeshStandardMaterial({color:0x3d9caa,roughness:.25});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),sand);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Dune ridges
for(let i=0;i<24;i++){let d=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),mat(i%2?0xc99d60:0xe0bd83));d.scale.set(18+Math.random()*25,2+Math.random()*4,8+Math.random()*15);d.position.set((Math.random()-.5)*300,-1.5,-70-Math.random()*220);scene.add(d)}
// Oasis
const pool=new THREE.Mesh(new THREE.CircleGeometry(13,40),water);pool.rotation.x=-Math.PI/2;pool.position.set(24,.04,-28);scene.add(pool);
const palm=(x,z)=>{let g=new THREE.Group();let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,7,7),mat(0x77502e));trunk.position.y=3.5;g.add(trunk);for(let j=0;j<8;j++){let leaf=new THREE.Mesh(new THREE.ConeGeometry(.65,7,5),mat(0x46643a));leaf.position.set(Math.cos(j*Math.PI/4)*2,7,Math.sin(j*Math.PI/4)*2);leaf.rotation.z=-Math.PI/2.6;leaf.rotation.y=j*Math.PI/4;g.add(leaf)}g.position.set(x,0,z);scene.add(g)};
for(let i=0;i<12;i++){let a=i*Math.PI/6;palm(24+Math.cos(a)*17,-28+Math.sin(a)*17)}
// Decorative village built-in fallback structures
function house(x,z){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(9,5,8),mat(0xb78b5c));b.position.y=2.5;g.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(9.8,.7,8.8),mat(0x8a6344));roof.position.y=5.2;g.add(roof);let door=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.7,.15),dark);door.position.set(0,1.35,4.08);g.add(door);g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<9;i++)house(-35+(i%3)*12,-25-Math.floor(i/3)*12);
// Player
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.05,4,8),mat(0x8b3e25));body.position.y=1.05;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0x9b6847));head.position.y=1.95;player.add(head);const cloth=new THREE.Mesh(new THREE.BoxGeometry(1.05,.22,.65),mat(0xd7c08e));cloth.position.set(0,1.5,0);player.add(cloth);player.position.set(0,0,8);scene.add(player);
// NPCs
for(let i=0;i<5;i++){let n=new THREE.Group();let robe=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,3,7),mat([0x6e4b36,0x8c7650,0x4d5542][i%3]));robe.position.y=.95;n.add(robe);let h=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),mat(0x986b4a));h.position.y=1.8;n.add(h);n.position.set(-20+i*10,0,-18-(i%2)*8);scene.add(n)}
// GLB asset placement: real repository models loaded from root
const loader=new GLTFLoader();let loaded=0;const assets=[
['desert-step-pyramid.glb',-65,-95,1.7],['great-sandstone-sphinx.glb',-42,-83,1.5],['desert-temple-hall.glb',5,-115,1.5],['pharaoh-colossi-gate.glb',5,-92,1.2],['desert-tomb-entrance.glb',68,-72,1.4],['desert-city-gate.glb',-18,-48,1.1],['mud-brick-desert-house.glb',-42,-12,1.2],['desert-bazaar-stall.glb',-22,-12,1.1],['desert-oasis-camp.glb',38,-35,1.1],['desert-throne-room.glb',78,-118,1.2],['desert-animals-set.glb',44,-15,1],['desert-tomb-terrain-kit.glb',92,-80,1.2],['desert-obelisk-set.glb',-5,-72,1.1],['sandstone-ruin-kit.glb',-85,-40,1.2],['desert-relics-set.glb',20,-65,1],['desert-camel-caravan.glb',-52,18,1],['desert-carved-tablets.glb',-75,-65,1],['desert-tent-camp.glb',56,12,1],['royal-desert-sarcophagus.glb',80,-90,1],['desert-well.glb',-6,18,1],['desert-dig-site.glb',100,-25,1],['buried-reed-boat.glb',-105,-35,1],['desert-treasure-vault.glb',110,-115,1],['tomb-trap-corridor.glb',94,-105,1]
];
function progress(){ $('progress').style.width=Math.round(loaded/assets.length*100)+'%';$('loadtext').textContent=`Antik yapılar yükleniyor… ${loaded}/${assets.length}` }
for(const [file,x,z,s] of assets){loader.load('./'+file,g=>{const m=g.scene;m.scale.setScalar(s);m.position.set(x,0,z);m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(m);loaded++;progress()},undefined,()=>{loaded++;progress()})}
// Relic markers
const relics=[];for(let i=0;i<6;i++){let g=new THREE.Group();let base=new THREE.Mesh(new THREE.CylinderGeometry(.65,.8,.22,8),mat(0x6c4a2d));base.position.y=.12;g.add(base);let gem=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0xe8bd55,metalness:.65,roughness:.25,emissive:0x6b3900}));gem.position.y=1;g.add(gem);g.position.set([-62,-38,10,54,83,112][i],0,[-65,-8,-55,-88,-42,-105][i]);scene.add(g);relics.push({g,found:false})}
let found=0;const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};
// Controls
let joy={x:0,y:0},running=false,yaw=0,drag=null;const stick=$('stick'),nub=$('nub');stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moveJoy(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e)});function moveJoy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=39;if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}function resetJoy(){joy={x:0,y:0};nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);$('run').addEventListener('pointerdown',()=>running=true);$('run').addEventListener('pointerup',()=>running=false);$('run').addEventListener('pointerleave',()=>running=false);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42)drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-drag.x)*.006;drag={x:e.clientX,y:e.clientY}}});renderer.domElement.addEventListener('pointerup',()=>drag=null);
$('interact').onclick=()=>{let near=null,dist=999;for(const r of relics){let d=player.position.distanceTo(r.g.position);if(!r.found&&d<dist){dist=d;near=r}}if(near&&dist<5){near.found=true;near.g.visible=false;found++;$('found').textContent=found;toast(found===6?'Bütün eserler bulundu! Tapınağa dön.':`Kutsal eser bulundu (${found}/6)`)}else toast('Yakında incelenecek bir eser yok.');};
let camTarget=new THREE.Vector3();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);for(const r of relics)if(!r.found)r.g.rotation.y+=dt*.8;let speed=running?12:6;let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let move=forward.clone().multiplyScalar(-joy.y).add(right.multiplyScalar(joy.x));if(move.lengthSq()>.01){move.normalize();player.position.addScaledVector(move,speed*dt);player.rotation.y=Math.atan2(move.x,move.z)}let desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*8,player.position.y+5.2,player.position.z+Math.cos(yaw)*8);camera.position.lerp(desired,.12);camTarget.set(player.position.x,1.3,player.position.z);camera.lookAt(camTarget);renderer.render(scene,camera)}
let ready=false;const reveal=()=>{if(ready)return;ready=true;$('loading').style.opacity=0;setTimeout(()=>$('loading').remove(),650);toast('Keşif başladı. Eserleri bul!')};setTimeout(reveal,8500);let check=setInterval(()=>{if(loaded===assets.length){clearInterval(check);reveal()}},250);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();
</script></body></html>
