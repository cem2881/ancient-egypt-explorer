<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MEDJAY - Antik Mısır</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c69a63;font-family:Arial,system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#17130e;color:#f2d09a;text-align:center;font-size:20px;padding:24px}
#loading small{display:block;font-size:12px;margin-top:12px;color:#d3b88c}
#fatal{display:none;position:fixed;inset:12px;z-index:30;background:#321b13;color:#fff;padding:18px;border-radius:12px;white-space:pre-wrap;overflow:auto}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#20170fe0;border:1px solid #dfbd86aa;border-radius:12px;padding:9px 12px;text-shadow:0 1px 2px #000}
#top{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
#quest{max-width:70%}
#stick{position:absolute;left:20px;bottom:24px;width:124px;height:124px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff88;pointer-events:auto;touch-action:none}
#nub{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ecd5a9;border:2px solid white}
#buttons{position:absolute;right:14px;bottom:29px;display:flex;gap:8px;pointer-events:auto}
button{width:66px;height:66px;border-radius:50%;background:#302216ee;color:#fff;border:2px solid #e7c18a;font-weight:bold;font-size:11px;touch-action:manipulation}
#hint{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s;font-size:12px;max-width:90%;text-align:center}
</style>

<!-- ÖNEMLİ: Three.js modül eşlemesi -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="loading">
  <div>
    <b>MEDJAY</b><br><br>
    Antik Mısır dünyası hazırlanıyor…
    <small id="loadmsg">Oyun sahnesi kuruluyor</small>
  </div>
</div>

<div id="fatal"></div>

<div id="hud">
  <div id="top">
    <div class="panel" id="quest">GÖREV: Hassan'ı bul ve kayıp emanetleri araştır.</div>
    <div class="panel">♥ <span id="health">100</span><br><span id="status">MEDJAY</span></div>
  </div>
  <div id="toast" class="panel"></div>
  <div id="hint" class="panel">Sol joystick: hareket · Sağ tarafı sürükle: kamera</div>
  <div id="stick"><div id="nub"></div></div>
  <div id="buttons">
    <button id="attack">KILIÇ</button>
    <button id="interact">ETKİLEŞ</button>
  </div>
</div>

<script>
window.addEventListener('error',e=>{
  const f=document.getElementById('fatal');
  if(f){
    f.style.display='block';
    f.textContent='Oyun yüklenemedi:\n'+(e.message||'Bilinmeyen hata');
  }
});
window.addEventListener('unhandledrejection',e=>{
  const f=document.getElementById('fatal');
  if(f){
    f.style.display='block';
    f.textContent='Oyun hatası:\n'+String(e.reason);
  }
});
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd9b57e);
scene.fog=new THREE.FogExp2(0xcaa16d,.0019);

const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,650);

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe8c8,0x765334,2.0));

const sun=new THREE.DirectionalLight(0xffd49c,2.6);
sun.position.set(-95,135,75);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-135;
sun.shadow.camera.right=135;
sun.shadow.camera.top=135;
sun.shadow.camera.bottom=-135;
scene.add(sun);

const mat=(c,r=.96)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const sand=mat(0xcba875);
const darkSand=mat(0xa77c4d);
const rock=mat(0x8c704f);
const skin=mat(0x986744);
const hair=mat(0x241910);
const darkCloth=mat(0x443329);

function terrainY(x,z){
  return Math.sin(x*.026)*2.5+
  Math.cos(z*.03)*2.7+
  Math.sin((x+z)*.018)*1.6+
  Math.sin(x*.075+z*.035)*.42;
}

// ÇÖL ZEMİNİ
const N=140,SIZE=440,vertices=[],indices=[];

for(let iz=0;iz<=N;iz++){
  for(let ix=0;ix<=N;ix++){
    const x=(ix/N-.5)*SIZE;
    const z=(iz/N-.5)*SIZE;

    vertices.push(x,terrainY(x,z),z);

    if(ix<N&&iz<N){
      const a=iz*(N+1)+ix;
      const b=a+1;
      const c=a+N+1;
      const d=c+1;
      indices.push(a,c,b,b,c,d);
    }
  }
}

const floorGeo=new THREE.BufferGeometry();
floorGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
floorGeo.setIndex(indices);
floorGeo.computeVertexNormals();

const floor=new THREE.Mesh(floorGeo,sand);
floor.receiveShadow=true;
scene.add(floor);

// KUM TEPESİ ŞEKİLLERİ
for(let i=0;i<38;i++){
  const x=(Math.random()-.5)*390;
  const z=(Math.random()-.5)*390;

  const dune=new THREE.Mesh(
    new THREE.SphereGeometry(1,14,9),
    i%4===0?darkSand:sand
  );

  dune.scale.set(
    14+Math.random()*21,
    1.1+Math.random()*2.2,
    6+Math.random()*10
  );

  dune.position.set(x,terrainY(x,z)-.45,z);
  dune.rotation.y=Math.random()*Math.PI;
  scene.add(dune);
}

// ÇÖL KAYALARI
for(let i=0;i<100;i++){
  const x=(Math.random()-.5)*370;
  const z=(Math.random()-.5)*370;

  if(Math.abs(x)<16&&Math.abs(z)<16)continue;

  const r=new THREE.Mesh(
    new THREE.DodecahedronGeometry(.6+Math.random()*1.7),
    rock
  );

  r.position.set(x,terrainY(x,z)+.2,z);
  r.scale.y=.45+Math.random()*.65;
  r.rotation.set(Math.random(),Math.random(),Math.random());
  r.castShadow=true;
  scene.add(r);
}

// VAHA
const water=new THREE.Mesh(
  new THREE.CircleGeometry(13,44),
  new THREE.MeshStandardMaterial({
    color:0x397f83,
    roughness:.28,
    metalness:.05
  })
);

water.rotation.x=-Math.PI/2;
water.position.set(49,terrainY(49,-35)+.22,-35);
water.scale.set(1,.72,1);
scene.add(water);

// UZAK PİRAMİT
function distantPyramid(x,z,base,height){
  const g=new THREE.Group();

  for(let i=0;i<20;i++){
    const t=i/20;
    const half=base*(1-t);

    const m=new THREE.Mesh(
      new THREE.CylinderGeometry(.02,half,height/20*1.08,4),
      mat(i%2?0xc4a47a:0xb99468)
    );

    m.rotation.y=Math.PI/4;
    m.position.y=(i+.5)*height/20;
    m.castShadow=true;
    g.add(m);
  }

  g.position.set(x,terrainY(x,z),z);
  scene.add(g);
}
distantPyramid(-135,-120,18,30);

// KARAKTER MODELİ
function human(x,z,clothColor){
  const g=new THREE.Group();
  const clothes=mat(clothColor);

  const torso=new THREE.Mesh(
    new THREE.CapsuleGeometry(.34,.64,4,9),clothes
  );
  torso.position.y=1.24;
  g.add(torso);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.235,14,12),skin
  );
  head.position.y=1.94;
  g.add(head);

  const hairCap=new THREE.Mesh(
    new THREE.SphereGeometry(.245,14,10),hair
  );
  hairCap.scale.y=.5;
  hairCap.position.set(0,2.07,-.025);
  g.add(hairCap);

  const nose=new THREE.Mesh(
    new THREE.ConeGeometry(.05,.14,6),skin
  );
  nose.rotation.x=Math.PI/2;
  nose.position.set(0,1.94,.22);
  g.add(nose);

  const beard=new THREE.Mesh(
    new THREE.ConeGeometry(.12,.22,8),hair
  );
  beard.position.set(0,1.74,.18);
  g.add(beard);

  for(const s of [-1,1]){
    const eye=new THREE.Mesh(
      new THREE.SphereGeometry(.026,8,6),
      mat(0x17120e)
    );
    eye.position.set(s*.085,1.99,.205);
    g.add(eye);

    const arm=new THREE.Mesh(
      new THREE.CapsuleGeometry(.09,.47,3,7),skin
    );
    arm.position.set(s*.39,1.34,0);
    arm.rotation.z=s*.16;
    g.add(arm);

    const hand=new THREE.Mesh(
      new THREE.SphereGeometry(.1,9,7),skin
    );
    hand.position.set(s*.4,1.01,.015);
    g.add(hand);

    const leg=new THREE.Mesh(
      new THREE.CapsuleGeometry(.12,.54,3,7),darkCloth
    );
    leg.position.set(s*.16,.44,0);
    g.add(leg);

    const foot=new THREE.Mesh(
      new THREE.BoxGeometry(.18,.1,.3),darkCloth
    );
    foot.position.set(s*.16,.11,.08);
    g.add(foot);
  }

  g.position.set(x,terrainY(x,z),z);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  scene.add(g);
  return g;
}

const player=human(0,12,0x80613f);
const hassan=human(30,36,0xd6c39a);
const merchant=human(40,39,0x79513a);
const guard=human(20,48,0x48534b);

let enemies=[
  human(-12,-12,0x59372a),
  human(-19,-17,0x633b2b)
];

// GÖREV EMANETLERİ
let relicPositions=[
  [-78,45],
  [84,-35],
  [-20,-95]
];

let relicMeshes=[];

for(const [x,z] of relicPositions){
  const r=new THREE.Mesh(
    new THREE.OctahedronGeometry(1),
    new THREE.MeshStandardMaterial({
      color:0xffd34e,
      emissive:0x9c5b08,
      emissiveIntensity:1.4
    })
  );

  r.position.set(x,terrainY(x,z)+2,z);
  scene.add(r);
  relicMeshes.push(r);
}

let found=0;

// JOYSTICK VE KAMERA
let joy={x:0,y:0};
let camYaw=0;
let camPitch=.16;
let stickOn=false;

const stick=$('stick');
const nub=$('nub');

function setJoy(e){
  const r=stick.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2);
  const dy=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(dx,dy);
  const k=Math.min(1,50/Math.max(len,1));

  joy.x=dx*k/50;
  joy.y=dy*k/50;

  nub.style.transform=`translate(${joy.x*36}px,${joy.y*36}px)`;
}

stick.addEventListener('pointerdown',e=>{
  stickOn=true;
  stick.setPointerCapture(e.pointerId);
  setJoy(e);
});

stick.addEventListener('pointermove',e=>{
  if(stickOn)setJoy(e);
});

function stopJoy(){
  stickOn=false;
  joy={x:0,y:0};
  nub.style.transform='';
}

stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);

let dragging=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

addEventListener('pointerup',()=>dragging=false);

renderer.domElement.addEventListener('pointermove',e=>{
  if(dragging){
    camYaw-=(e.clientX-lastX)*.005;
    camPitch=Math.max(-.08,Math.min(.6,camPitch+(e.clientY-lastY)*.003));
    lastX=e.clientX;
    lastY=e.clientY;
  }
});

function toast(msg){
  $('toast').textContent=msg;
  $('toast').style.opacity=1;
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>$('toast').style.opacity=0,1900);
}

// SAVAŞ
$('attack').onclick=()=>{
  const i=enemies.findIndex(
    e=>e.position.distanceTo(player.position)<4.5
  );

  if(i>=0){
    scene.remove(enemies[i]);
    enemies.splice(i,1);
    $('status').textContent='DÜŞMAN YENİLDİ';
    toast('Düşman etkisiz hâle getirildi.');
  }else{
    toast('Yakında düşman yok.');
  }
};

// ETKİLEŞİM
$('interact').onclick=()=>{
  for(let i=0;i<relicPositions.length;i++){
    const [x,z]=relicPositions[i];

    if(Math.hypot(player.position.x-x,player.position.z-z)<10){
      scene.remove(relicMeshes[i]);
      relicPositions.splice(i,1);
      relicMeshes.splice(i,1);
      found++;

      $('quest').textContent='EMANETLER: '+found+'/3';
      toast('Altın emanet bulundu!');

      if(found===3)toast('Görev tamamlandı! Hassan’a dön.');
      return;
    }
  }

  if(player.position.distanceTo(hassan.position)<8){
    $('quest').textContent='HASSAN: Üç altın emaneti bul ve bana getir.';
    toast('Hassan: Emanetler eski tapınaklarda saklı.');
  }else if(player.position.distanceTo(merchant.position)<8){
    toast('Tüccar: Çölde izlerini kaybetme, Medjay.');
  }else{
    toast('Yakında etkileşilecek bir şey yok.');
  }
};

// 25 MODELİN GERÇEK DOSYA ADLARI
// Modeller GitHub ana dizininde, index.html ile aynı yerde olmalı.
const modelSpecs=[
 ['desert-step-pyramid.glb',-65,-65,30,.2],
 ['great-sandstone-sphinx.glb',-42,-58,11,0],
 ['desert-temple-hall.glb',70,-55,19,Math.PI],
 ['pharaoh-colossi-gate.glb',82,-34,17,Math.PI/2],
 ['desert-tomb-entrance.glb',-85,45,13,.6],
 ['desert-city-gate.glb',15,55,14,Math.PI],
 ['mud-brick-desert-house.glb',28,40,9,.2],
 ['desert-bazaar-stall.glb',38,37,6,0],
 ['desert-oasis-camp.glb',52,-35,13,0],
 ['desert-throne-room.glb',100,22,14,0],
 ['desert-animals-set.glb',58,-22,7,0],
 ['desert-tomb-terrain-kit.glb',-115,45,12,0],
 ['desert-obelisk-set.glb',-20,10,13,.4],
 ['sandstone-ruin-kit.glb',-15,-95,14,1],
 ['desert-relics-set.glb',85,-75,7,0],
 ['desert-camel-caravan.glb',-35,15,8,.5],
 ['desert-explorer-truck.glb',-45,65,6,.5],
 ['desert-carved-tablets.glb',-80,42,5,.2],
 ['desert-tent-camp.glb',45,-43,8,0],
 ['royal-desert-sarcophagus.glb',-90,55,5,0],
 ['desert-well.glb',24,52,5,0],
 ['desert-dig-site.glb',-72,40,8,0],
 ['buried-reed-boat.glb',62,-30,6,.4],
 ['desert-treasure-vault.glb',-105,30,8,0],
 ['tomb-trap-corridor.glb',-100,65,8,0]
];

const gltfLoader=new GLTFLoader();
let modelDone=0;
let modelFailed=0;
let modelStarted=false;

function loadOneModel(spec){
  const [file,x,z,targetH,rotation]=spec;

  return new Promise(resolve=>{
    let settled=false;

    const finish=value=>{
      if(settled)return;
      settled=true;
      clearTimeout(timer);
      resolve(value);
    };

    // Bir model takılırsa diğerleri ve oyun çalışmaya devam eder.
    const timer=setTimeout(()=>{
      modelFailed++;
      finish(null);
      updateLoadText();
    },16000);

    gltfLoader.load('./'+file,gltf=>{
      if(settled)return;

      try{
        const obj=gltf.scene;
        let box=new THREE.Box3().setFromObject(obj);
        const size=new THREE.Vector3();
        box.getSize(size);

        const scale=targetH/Math.max(size.y,.001);
        obj.scale.setScalar(scale);

        box=new THREE.Box3().setFromObject(obj);
        obj.position.set(x,terrainY(x,z)-box.min.y,z);
        obj.rotation.y=rotation;

        obj.traverse(n=>{
          if(n.isMesh){
            n.castShadow=true;
            n.receiveShadow=true;
          }
        });

        scene.add(obj);
        modelDone++;
        finish(obj);
        updateLoadText();

      }catch(err){
        modelFailed++;
        finish(null);
        updateLoadText();
      }

    },undefined,()=>{
      modelFailed++;
      finish(null);
      updateLoadText();
    });
  });
}

function updateLoadText(){
  const total=modelDone+modelFailed;
  $('loadmsg').textContent='3D çevre modelleri: '+total+'/25';

  if(total>=25){
    $('loadmsg').textContent='Keşfe hazırsın · '+modelDone+' model yüklendi';
  }
}

async function startModelLoading(){
  if(modelStarted)return;
  modelStarted=true;

  let cursor=0;

  async function worker(){
    while(cursor<modelSpecs.length){
      const spec=modelSpecs[cursor++];
      await loadOneModel(spec);
    }
  }

  // iPhone belleğini korumak için ikişer model yüklenir.
  await Promise.all([worker(),worker()]);
}

// OYUN DÖNGÜSÜ
// Modelleri beklemeden oyun başlar.
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);
  const forward=-joy.y;
  const side=joy.x;

  const dx=side*Math.cos(camYaw)-forward*Math.sin(camYaw);
  const dz=-side*Math.sin(camYaw)-forward*Math.cos(camYaw);
  const speed=Math.hypot(dx,dz);

  if(speed>.05){
    player.position.x+=dx/speed*dt*8.1;
    player.position.z+=dz/speed*dt*8.1;
    player.rotation.y=Math.atan2(dx,dz);
  }

  player.position.y=terrainY(player.position.x,player.position.z);

  [hassan,merchant,guard].forEach((n,i)=>{
    n.rotation.y=Math.sin(clock.elapsedTime*.45+i)*.12;
  });

  enemies.forEach(e=>{
    if(e.position.distanceTo(player.position)<22){
      const v=player.position.clone().sub(e.position).normalize();
      e.position.add(v.multiplyScalar(dt*1.6));
      e.position.y=terrainY(e.position.x,e.position.z);
    }
  });

  relicMeshes.forEach((r,i)=>{
    r.rotation.y+=dt*.8;
    r.position.y=terrainY(r.position.x,r.position.z)+2+
    Math.sin(clock.elapsedTime*2+i)*.25;
  });

  const target=new THREE.Vector3(
    player.position.x+Math.sin(camYaw)*9.5,
    player.position.y+4.3+camPitch*5,
    player.position.z+Math.cos(camYaw)*9.5
  );

  camera.position.lerp(target,.1);
  camera.lookAt(
    player.position.x,
    player.position.y+1.25,
    player.position.z
  );

  renderer.render(scene,camera);
}

try{
  animate();
  $('loading').style.display='none';
  startModelLoading();
}catch(err){
  $('fatal').style.display='block';
  $('fatal').textContent='Oyun başlatılamadı:\n'+String(err);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
