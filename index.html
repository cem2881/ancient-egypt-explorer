
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Mısır - Kayıp Firavun</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#d9a75e;font-family:Arial;color:white;touch-action:none}
#info{position:absolute;top:15px;left:15px;z-index:2;text-shadow:1px 2px 4px #000}
#info h2{margin:0;font-size:20px}
#info p{font-size:12px}
#joy{position:absolute;bottom:35px;left:30px;width:115px;height:115px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;z-index:3}
#stick{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#ffffffbd}
#look{position:absolute;right:25px;bottom:48px;width:90px;height:90px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;display:grid;place-items:center;font-size:30px}
#hint{position:absolute;bottom:12px;width:100%;text-align:center;font-size:11px;text-shadow:1px 1px 3px black;pointer-events:none}
</style>
</head>
<body>
<div id="info">
<h2>𓂀 KAYIP FİRAVUN</h2>
<p>ANTİK MISIR • KEŞİF</p>
</div>
<div id="joy"><div id="stick"></div></div>
<div id="look">↻</div>
<div id="hint">Joystick ile çölde dolaş • Sağdaki düğmeyle kamerayı çevir</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe9b96d);
scene.fog=new THREE.Fog(0xe9b96d,35,150);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe3b0,0x79502c,2));
const sun=new THREE.DirectionalLight(0xffd28a,2);
sun.position.set(-30,60,20);
scene.add(sun);

function box(x,y,z,sx,sy,sz,color){
const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color}));
m.position.set(x,y,z);scene.add(m);return m;
}

// Desert
const sand=new THREE.Mesh(
new THREE.PlaneGeometry(220,220),
new THREE.MeshStandardMaterial({color:0xd9a653})
);
sand.rotation.x=-Math.PI/2;
sand.position.y=-.08;
scene.add(sand);

// Sand dunes
for(let i=0;i<35;i++){
const dune=new THREE.Mesh(
new THREE.SphereGeometry(1,8,6),
new THREE.MeshStandardMaterial({color:i%2?0xc99448:0xe3b66c})
);
dune.scale.set(THREE.MathUtils.randFloat(5,13),1,THREE.MathUtils.randFloat(3,8));
dune.position.set(Math.random()*180-90,0,Math.random()*180-90);
scene.add(dune);
}

// Pyramids
function pyramid(x,z,size){
const p=new THREE.Mesh(
new THREE.ConeGeometry(size, size*1.35,4),
new THREE.MeshStandardMaterial({color:0xc99b60,flatShading:true})
);
p.rotation.y=Math.PI/4;
p.position.set(x,size*.675,z);
scene.add(p);
}
pyramid(-13,-35,14);
pyramid(12,-43,11);
pyramid(32,-34,7);
pyramid(-48,-65,19);

// Nile
const river=new THREE.Mesh(
new THREE.PlaneGeometry(15,190),
new THREE.MeshStandardMaterial({color:0x368eae,roughness:.3})
);
river.rotation.x=-Math.PI/2;
river.position.set(55,.03,0);
scene.add(river);

// Palm trees
function palm(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.4,5,6),
new THREE.MeshStandardMaterial({color:0x81502b})
);
trunk.position.set(x,2.5,z);scene.add(trunk);
for(let i=0;i<7;i++){
const leaf=new THREE.Mesh(
new THREE.ConeGeometry(.55,4,5),
new THREE.MeshStandardMaterial({color:0x357342})
);
leaf.position.set(x+Math.cos(i*Math.PI/3.5)*1.4,5,z+Math.sin(i*Math.PI/3.5)*1.4);
leaf.rotation.z=Math.PI/2;
leaf.rotation.y=i*Math.PI/3.5;
scene.add(leaf);
}
}
for(let i=0;i<16;i++)palm(45+Math.random()*12,Math.random()*100-50);

// Ancient temple
box(-32,2,-25,18,4,9,0xb88a53);
for(let i=0;i<6;i++){
const col=new THREE.Mesh(
new THREE.CylinderGeometry(.7,.8,6,8),
new THREE.MeshStandardMaterial({color:0xe4c18a})
);
col.position.set(-39+i*2.8,3,-19);
scene.add(col);
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(
new THREE.CylinderGeometry(.48,.6,1.6,8),
new THREE.MeshStandardMaterial({color:0x9c542c})
);
body.position.y=1.1;player.add(body);
const head=new THREE.Mesh(
new THREE.SphereGeometry(.43,10,8),
new THREE.MeshStandardMaterial({color:0xb77c52})
);
head.position.y=2.15;player.add(head);
const cloth=new THREE.Mesh(
new THREE.BoxGeometry(1,.45,.65),
new THREE.MeshStandardMaterial({color:0xe6d7ad})
);
cloth.position.y=.5;player.add(cloth);
scene.add(player);
player.position.set(0,0,5);

// Controls
let joy={x:0,y:0},camAngle=0;
const pad=document.getElementById('joy');
const stick=document.getElementById('stick');
let active=false;
pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);moveJoy(e)});
pad.addEventListener('pointermove',e=>{if(active)moveJoy(e)});
function moveJoy(e){
const r=pad.getBoundingClientRect();
let x=e.clientX-r.left-57.5,y=e.clientY-r.top-57.5;
const len=Math.hypot(x,y),max=35;
if(len>max){x=x/len*max;y=y/len*max}
stick.style.transform=`translate(${x}px,${y}px)`;
joy.x=x/max;joy.y=y/max;
}
function stopJoy(){active=false;joy={x:0,y:0};stick.style.transform='translate(0,0)'}
pad.addEventListener('pointerup',stopJoy);
pad.addEventListener('pointercancel',stopJoy);

document.getElementById('look').addEventListener('pointerdown',e=>{
camAngle+=.55;
});

// Camera and movement
const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
const speed=9;
const forward=new THREE.Vector3(-Math.sin(camAngle),0,-Math.cos(camAngle));
const right=new THREE.Vector3(Math.cos(camAngle),0,-Math.sin(camAngle));
player.position.addScaledVector(forward,-joy.y*speed*dt);
player.position.addScaledVector(right,joy.x*speed*dt);
player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);
player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90);
if(Math.abs(joy.x)+Math.abs(joy.y)>.1){
player.rotation.y=Math.atan2(joy.x,-joy.y)+camAngle;
}
const target=new THREE.Vector3(
player.position.x+Math.sin(camAngle)*9,
6,
player.position.z+Math.cos(camAngle)*9
);
camera.position.lerp(target,Math.min(1,dt*4));
camera.lookAt(player.position.x,1,player.position.z);
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
